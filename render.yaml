# Render blueprint — free web service running the single-service PaaS image.
#
# Intentionally NO database here: Render's free Postgres expires after 30
# days and deletes the data. Use a free-forever database instead (Tiger
# Cloud — no credit card, no expiry) and paste its URL as DATABASE_URL in
# the Render dashboard after the first deploy.
#
# Deploy: push this repo to GitHub → Render → New → Blueprint → pick repo.
# (On Koyeb instead: create a Web service from the repo with Dockerfile
# path "Dockerfile.paaS" and set the same env vars.)
services:
  - type: web
    name: sentinel
    runtime: docker
    dockerfilePath: ./Dockerfile.paaS
    plan: free
    healthCheckPath: /health
    envVars:
      # Paste the Tiger Cloud connection string (Settings → Env in dashboard):
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # Render routes traffic to $PORT:
      - key: PORT
        value: "10000"
