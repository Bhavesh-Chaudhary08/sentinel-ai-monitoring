# Production / sharing stack — self-contained (use alone, not with the base file):
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from the dev compose file:
#   * ONE public origin: Caddy terminates HTTPS (auto Let's Encrypt) and
#     proxies to the frontend nginx, which proxies /api to the API — the
#     dashboard, REST, and the alert WebSocket all share https://$DOMAIN.
#   * db / redis / api publish NO host ports — they are only reachable on the
#     internal Docker network. Only Caddy listens on 80/443.
#   * SECRET_KEY, POSTGRES_PASSWORD and DOMAIN are REQUIRED (compose fails
#     fast with a clear message instead of starting an insecure stack).
#
# Required .env entries (see DEPLOY.md):
#   DOMAIN=ai.example.com
#   SECRET_KEY=<long random>          python -c "import secrets; print(secrets.token_urlsafe(48))"
#   POSTGRES_PASSWORD=<long random>   must be URL-safe (token_urlsafe)

name: aidlp-prod

x-backend-env: &backend-env
  DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-aidlp}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-aidlp}"
  REDIS_URL: "redis://redis:6379/0"
  SECRET_KEY: "${SECRET_KEY:?set SECRET_KEY in .env (python -c \"import secrets; print(secrets.token_urlsafe(48))\")}"
  ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-480}"
  # Single origin → CORS only ever needs the dashboard itself.
  CORS_ORIGINS: "[\"https://${DOMAIN:?set DOMAIN in .env (your DNS name)}\"]"
  # false = classify in the Celery worker (scales horizontally);
  # true  = classify inline in the API process (tiny VMs, no worker load).
  CLASSIFY_SYNC: "${CLASSIFY_SYNC:-false}"
  PRESIDIO_ENABLED: "${PRESIDIO_ENABLED:-true}"
  SEMANTIC_ENABLED: "${SEMANTIC_ENABLED:-true}"
  RETENTION_DAYS_DEFAULT: "${RETENTION_DAYS_DEFAULT:-30}"
  RETENTION_DAYS_FLAGGED: "${RETENTION_DAYS_FLAGGED:-180}"
  STORAGE_MODE: "${STORAGE_MODE:-full}"
  RETENTION_DAYS_FULL: "${RETENTION_DAYS_FULL:-30}"
  CAPTURE_RESPONSES: "${CAPTURE_RESPONSES:-false}"

x-backend: &backend
  build:
    context: ./backend
    args:
      # INSTALL_ML=0 + SEMANTIC_ENABLED=false → much smaller/faster image for
      # small free-tier VMs (see README "Lightweight mode").
      INSTALL_NLP: "${INSTALL_NLP:-1}"
      INSTALL_ML: "${INSTALL_ML:-1}"
  environment: *backend-env
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aidlp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-aidlp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aidlp} -d ${POSTGRES_DB:-aidlp}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Queue + WebSocket pub/sub only; nothing persisted to disk.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    <<: *backend
    command: alembic upgrade head
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    <<: *backend
    command: celery -A app.workers.celery_app beat --loglevel=INFO
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Optional demo data: docker compose -f docker-compose.prod.yml --profile tools run --rm seed
  seed:
    <<: *backend
    command: python -m app.db.seed
    restart: "no"
    profiles: ["tools"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  # The only published ports on the host (80/443). Auto-HTTPS via Let's
  # Encrypt; cert state lives in the caddy_data volume so renewals are free
  # of rate limits.
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (your DNS name)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
